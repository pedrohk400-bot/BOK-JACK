<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شحن الرصيد - BOK JACK</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:#0d1117;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:92%;
    max-width:400px;
    background:#151b23;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.4);
}

.logo{
    text-align:center;
    font-size:34px;
    font-weight:bold;
}

.sub{
    text-align:center;
    color:#aaa;
    margin:8px 0 25px;
}

input,button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border-radius:12px;
    font-size:16px;
}

input{
    background:#0d1117;
    border:1px solid #30363d;
    color:white;
}

button{
    background:#b00020;
    color:white;
    border:0;
    font-weight:bold;
}

button:disabled{
    opacity:.6;
}

.message{
    text-align:center;
    margin-top:15px;
    line-height:1.8;
}

.success{
    color:#35d07f;
}

.error{
    color:#ff5c5c;
}

.balance{
    font-size:24px;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="box">

    <div class="logo">JACK</div>

    <div class="sub">
        شحن الرصيد
    </div>

    <input
        id="accountNumber"
        type="text"
        inputmode="numeric"
        maxlength="7"
        placeholder="رقم الحساب">

    <input
        id="password"
        type="password"
        placeholder="كلمة المرور">

    <input
        id="amount"
        type="number"
        min="1"
        step="1"
        placeholder="المبلغ">

    <button id="rechargeBtn">
        شحن الرصيد
    </button>

    <div id="message" class="message"></div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    get,
    runTransaction
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig = {
    apiKey: "AIzaSyAuWY3OwE9Kjnn8vBhz2-yittn7dDntZBw",
    authDomain: "bok-jack.firebaseapp.com",
    databaseURL: "https://bok-jack-default-rtdb.firebaseio.com",
    projectId: "bok-jack",
    storageBucket: "bok-jack.firebasestorage.app",
    messagingSenderId: "96539205463",
    appId: "1:96539205463:web:a2cb846d657aa873182812",
    measurementId: "G-069BL15X9J"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


document.getElementById("rechargeBtn").addEventListener(
    "click",
    async () => {

        const accountNumber =
            document.getElementById("accountNumber")
            .value.trim();

        const password =
            document.getElementById("password")
            .value;

        const amount =
            Number(
                document.getElementById("amount").value
            );

        const message =
            document.getElementById("message");

        const button =
            document.getElementById("rechargeBtn");


        message.innerHTML = "";


        if(!/^[0-9]{7}$/.test(accountNumber)){

            message.innerHTML =
                '<span class="error">' +
                'رقم الحساب يجب أن يكون 7 أرقام' +
                '</span>';

            return;
        }


        if(!password){

            message.innerHTML =
                '<span class="error">' +
                'اكتب كلمة المرور' +
                '</span>';

            return;
        }


        if(!Number.isFinite(amount) || amount <= 0){

            message.innerHTML =
                '<span class="error">' +
                'أدخل مبلغاً صحيحاً' +
                '</span>';

            return;
        }


        button.disabled = true;
        button.innerText = "جاري الشحن...";


        try {

            /*
             * تسجيل الدخول بالحساب نفسه
             */

            const internalEmail =
                accountNumber + "@bokjack.local";


            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    internalEmail,
                    password
                );


            const uid =
                credential.user.uid;


            /*
             * جلب بيانات المستخدم
             */

            const userRef =
                ref(db, "users/" + uid);


            const snapshot =
                await get(userRef);


            if(!snapshot.exists()){

                throw new Error(
                    "بيانات الحساب غير موجودة"
                );

            }


            const userData =
                snapshot.val();


            /*
             * التأكد أن رقم الحساب يطابق
             * الحساب الذي تم تسجيل الدخول إليه
             */

            if(
                userData.accountNumber !==
                accountNumber
            ){

                throw new Error(
                    "الحساب غير متطابق"
                );

            }


            /*
             * إضافة المبلغ إلى الرصيد
             */

            await runTransaction(
                ref(db, "users/" + uid + "/balance"),
                currentBalance => {

                    const oldBalance =
                        Number(currentBalance) || 0;

                    return oldBalance + amount;

                }
            );


            /*
             * قراءة الرصيد الجديد
             */

            const newSnapshot =
                await get(userRef);


            const newData =
                newSnapshot.val();


            const newBalance =
                Number(newData.balance) || 0;


            message.innerHTML =
                '<span class="success">' +
                '✅ تم شحن الرصيد بنجاح<br><br>' +
                'المبلغ المضاف: ' +
                amount.toLocaleString() +
                '<br><br>' +
                'الرصيد الجديد:<br>' +
                '<span class="balance">' +
                newBalance.toLocaleString() +
                '</span>' +
                '</span>';


            button.innerText = "تم الشحن";


            /*
             * تسجيل الخروج بعد العملية
             */

            await signOut(auth);


        } catch(error){

            console.error(error);

            message.innerHTML =
                '<span class="error">' +
                '❌ تعذر تنفيذ عملية الشحن<br>' +
                'تأكد من رقم الحساب وكلمة المرور' +
                '</span>';

            button.disabled = false;
            button.innerText = "شحن الرصيد";

        }

    }
);

</script>

</body>

        placeholder="كلمة المرور">

    <div id="message" class="message"></div>

</div>
