<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOK JACK - زيادة الرصيد</title>

<style>

*{
    box-sizing:border-box;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        Arial,
        sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:#000;
    color:#fff;
}

.container{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:25px 16px 40px;
}

/* HEADER */

.header{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    font-size:30px;
    font-weight:800;
    letter-spacing:1px;
}

.subtitle{
    color:#888;
    margin-top:6px;
    font-size:14px;
}

/* BACK */

.back{
    display:block;
    color:#aaa;
    text-decoration:none;
    font-size:14px;
    margin-bottom:20px;
}

.back:hover{
    color:#fff;
}

/* CARD */

.card{
    background:#111;
    border:1px solid #292929;
    border-radius:22px;
    padding:22px;
}

.title{
    font-size:22px;
    font-weight:700;
    margin-bottom:22px;
}

/* INPUT */

.input-group{
    margin-bottom:17px;
}

label{
    display:block;
    color:#aaa;
    font-size:13px;
    margin-bottom:8px;
}

input{
    width:100%;
    height:52px;
    border-radius:14px;
    border:1px solid #303030;
    background:#181818;
    color:#fff;
    padding:0 15px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#777;
}

input::placeholder{
    color:#666;
}

/* SEARCH BUTTON */

.search-btn{
    width:100%;
    height:50px;
    border:1px solid #303030;
    background:#fff;
    color:#000;
    border-radius:14px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.search-btn:active{
    transform:scale(.98);
}

/* ACCOUNT INFO */

.account-info{
    display:none;
    margin-top:20px;
    padding:17px;
    background:#181818;
    border:1px solid #303030;
    border-radius:16px;
}

.account-name{
    font-size:19px;
    font-weight:700;
    margin-bottom:12px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #252525;
}

.info-row:last-child{
    border-bottom:0;
}

.info-label{
    color:#888;
    font-size:14px;
}

.info-value{
    font-size:15px;
    font-weight:600;
}

.current-balance{
    font-size:21px;
    font-weight:800;
}

/* RECHARGE */

.recharge-area{
    display:none;
    margin-top:20px;
}

.recharge-area label{
    margin-bottom:8px;
}

.recharge-btn{
    width:100%;
    height:54px;
    border:0;
    border-radius:15px;
    background:#fff;
    color:#000;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-top:8px;
}

.recharge-btn:active{
    transform:scale(.98);
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* MESSAGE */

.message{
    display:none;
    margin-top:18px;
    padding:14px;
    border-radius:13px;
    text-align:center;
    font-size:14px;
}

.success{
    display:block;
    background:#102315;
    color:#5cff82;
    border:1px solid #1e5c30;
}

.error{
    display:block;
    background:#261010;
    color:#ff6868;
    border:1px solid #5c2222;
}

.loading{
    display:none;
    text-align:center;
    color:#888;
    margin-top:18px;
}

</style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            BOK
        </div>

        <div class="subtitle">
            لوحة إدارة الحسابات
        </div>

    </div>


    <!-- BACK -->

    <a
        href="dashboard.html"
        class="back"
    >
        ← العودة إلى لوحة الإدارة
    </a>


    <!-- CARD -->

    <div class="card">


        <div class="title">
            زيادة الرصيد
        </div>


        <!-- ACCOUNT NUMBER -->

        <div class="input-group">

            <label>
                رقم الحساب
            </label>

            <input
                type="text"
                id="accountNumber"
                placeholder="أدخل رقم الحساب"
                inputmode="numeric"
                autocomplete="off"
            >

        </div>


        <!-- SEARCH -->

        <button
            id="searchBtn"
            class="search-btn"
            onclick="searchAccount()"
        >
            البحث عن الحساب
        </button>


        <!-- LOADING -->

        <div
            id="loading"
            class="loading"
        >
            جاري البحث...
        </div>


        <!-- ACCOUNT INFO -->

        <div
            id="accountInfo"
            class="account-info"
        >

            <div
                id="accountName"
                class="account-name"
            >
                —
            </div>


            <div class="info-row">

                <div class="info-label">
                    رقم الحساب
                </div>

                <div
                    id="showAccount"
                    class="info-value"
                >
                    —
                </div>

            </div>


            <div class="info-row">

                <div class="info-label">
                    الرصيد الحالي
                </div>

                <div
                    id="currentBalance"
                    class="info-value current-balance"
                >
                    0
                </div>

            </div>

        </div>


        <!-- RECHARGE AREA -->

        <div
            id="rechargeArea"
            class="recharge-area"
        >

            <label>
                مبلغ الزيادة
            </label>

            <input
                type="number"
                id="amount"
                placeholder="أدخل المبلغ"
                min="0"
                step="0.01"
                inputmode="decimal"
            >


            <button
                id="rechargeBtn"
                class="recharge-btn"
                onclick="rechargeBalance()"
            >
                زيادة الرصيد
            </button>

        </div>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


    </div>


</div>



<script type="module">


/* =========================
   FIREBASE APP
========================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


/* =========================
   FIREBASE DATABASE
========================= */

import {
    getDatabase,
    ref,
    get,
    runTransaction
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =========================
   FIREBASE AUTH
========================= */

import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyAuWY3OwE9Kjnn8vBhz2-yittn7dDntZBw",

    authDomain:
    "bok-jack.firebaseapp.com",

    databaseURL:
    "https://bok-jack-default-rtdb.firebaseio.com",

    projectId:
    "bok-jack",

    storageBucket:
    "bok-jack.firebasestorage.app",

    messagingSenderId:
    "96539205463",

    appId:
    "1:96539205463:web:a2cb846d657aa873182812",

    measurementId:
    "G-069BL15X9J"

};



/* =========================
   INITIALIZE
========================= */

const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getDatabase(app);


const auth =
    getAuth(app);



/* =========================
   ADMIN UID
========================= */

const ADMIN_UID =
    "qlaCFjAGCPPrg53Z7nCl5NDbAw62";


let adminReady =
    false;


let selectedAccount =
    null;



/* =========================
   CHECK ADMIN
========================= */

onAuthStateChanged(
    auth,
    function(user){

        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        if(user.uid !== ADMIN_UID){

            showError(
                "هذا الحساب غير مصرح له بإدارة النظام"
            );

            adminReady =
                false;

            return;

        }


        adminReady =
            true;

    }
);



/* =========================
   ACCOUNT INPUT
========================= */

document
.getElementById("accountNumber")
.addEventListener(
    "input",
    function(){

        this.value =
            this.value.replace(
                /[^0-9]/g,
                ""
            );

    }
);



/* =========================
   SEARCH ACCOUNT
========================= */

window.searchAccount =
async function(){


    if(!adminReady){

        showError(
            "يرجى تسجيل الدخول كأدمن أولاً"
        );

        return;

    }


    const accountNumber =
        document
        .getElementById(
            "accountNumber"
        )
        .value
        .trim();


    if(accountNumber === ""){

        showError(
            "أدخل رقم الحساب"
        );

        return;

    }


    const searchBtn =
        document.getElementById(
            "searchBtn"
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const accountInfo =
        document.getElementById(
            "accountInfo"
        );


    const rechargeArea =
        document.getElementById(
            "rechargeArea"
        );


    hideMessage();


    accountInfo.style.display =
        "none";


    rechargeArea.style.display =
        "none";


    loading.style.display =
        "block";


    searchBtn.disabled =
        true;


    try{


        const accountRef =
            ref(
                db,
                "accounts/" +
                accountNumber
            );


        const snapshot =
            await get(
                accountRef
            );


        if(!snapshot.exists()){

            selectedAccount =
                null;


            showError(
                "الحساب غير موجود"
            );

            return;

        }


        const data =
            snapshot.val();


        selectedAccount = {

            accountNumber:
                accountNumber,

            name:
                data.name ||
                "بدون اسم",

            balance:
                Number(
                    data.balance ||
                    0
                )

        };


        document
        .getElementById(
            "accountName"
        )
        .textContent =
            selectedAccount.name;


        document
        .getElementById(
            "showAccount"
        )
        .textContent =
            selectedAccount.accountNumber;


        document
        .getElementById(
            "currentBalance"
        )
        .textContent =
            selectedAccount.balance
            .toLocaleString(
                "en-US"
            );


        accountInfo.style.display =
            "block";


        rechargeArea.style.display =
            "block";


    }
    catch(error){

        console.error(error);

        showError(
            "حدث خطأ أثناء البحث: " +
            error.message
        );

    }
    finally{

        loading.style.display =
            "none";

        searchBtn.disabled =
            false;

    }

};



/* =========================
   RECHARGE BALANCE
========================= */

window.rechargeBalance =
async function(){


    if(!adminReady){

        showError(
            "يرجى تسجيل الدخول كأدمن أولاً"
        );

        return;

    }


    if(!selectedAccount){

        showError(
            "ابحث عن الحساب أولاً"
        );

        return;

    }


    const amountInput =
        document
        .getElementById(
            "amount"
        );


    const amountValue =
        amountInput.value.trim();


    const amount =
        Number(
            amountValue
        );


    if(
        amountValue === "" ||
        !Number.isFinite(amount) ||
        amount <= 0
    ){

        showError(
            "أدخل مبلغاً صحيحاً أكبر من صفر"
        );

        return;

    }


    const btn =
        document.getElementById(
            "rechargeBtn"
        );


    btn.disabled =
        true;


    btn.textContent =
        "جاري إضافة الرصيد...";


    hideMessage();


    try{


        const accountRef =
            ref(
                db,
                "accounts/" +
                selectedAccount.accountNumber
            );


        const result =
            await runTransaction(
                accountRef,
                function(currentData){

                    if(
                        currentData === null
                    ){

                        return;

                    }


                    const oldBalance =
                        Number(
                            currentData.balance ||
                            0
                        );


                    currentData.balance =
                        oldBalance +
                        amount;


                    return currentData;

                }
            );


        if(!result.committed){

            throw new Error(
                "لم يتم تحديث الحساب"
            );

        }


        const newData =
            result.snapshot.val();


        const newBalance =
            Number(
                newData.balance ||
                0
            );


        selectedAccount.balance =
            newBalance;


        document
        .getElementById(
            "currentBalance"
        )
        .textContent =
            newBalance.toLocaleString(
                "en-US"
            );


        amountInput.value =
            "";


        showSuccess(
            "تمت زيادة الرصيد بنجاح ✓"
        );


    }
    catch(error){

        console.error(error);

        showError(
            "حدث خطأ أثناء زيادة الرصيد: " +
            error.message
        );

    }
    finally{

        btn.disabled =
            false;

        btn.textContent =
            "زيادة الرصيد";

    }

};



/* =========================
   SUCCESS
========================= */

function showSuccess(text){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message success";


    message.style.display =
        "block";

}



/* =========================
   ERROR
========================= */

function showError(text){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message error";


    message.style.display =
        "block";

}



/* =========================
   HIDE MESSAGE
========================= */

function hideMessage(){

    const message =
        document.getElementById(
            "message"
        );


    message.style.display =
        "none";

}

</script>


</body>

      </html>
