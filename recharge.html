<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شحن الرصيد - BOK JACK</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#0d1117;
    color:white;
    font-family:Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:92%;
    max-width:400px;

    background:#151b23;

    padding:25px;

    border-radius:20px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.4);
}

.logo{
    text-align:center;

    font-size:34px;

    font-weight:bold;
}

.sub{
    text-align:center;

    color:#aaa;

    margin:
        8px 0 25px;
}

input,
button{

    width:100%;

    padding:14px;

    margin-top:12px;

    border-radius:12px;

    font-size:16px;
}

input{

    background:#0d1117;

    border:1px solid #30363d;

    color:white;

    outline:none;
}

button{

    background:#b00020;

    color:white;

    border:0;

    font-weight:bold;

    cursor:pointer;
}

button:disabled{

    opacity:.6;

    cursor:not-allowed;
}

.message{

    text-align:center;

    margin-top:18px;

    line-height:1.8;
}

.success{

    color:#35d07f;
}

.error{

    color:#ff5c5c;
}

.balance{

    font-size:26px;

    font-weight:bold;
}

</style>

</head>


<body>


<div class="box">

    <div class="logo">
        JACK
    </div>

    <div class="sub">
        شحن الرصيد
    </div>


    <input
        id="accountNumber"
        type="text"
        inputmode="numeric"
        maxlength="7"
        autocomplete="off"
        placeholder="رقم الحساب"
    >


    <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="كلمة المرور"
    >


    <input
        id="amount"
        type="number"
        inputmode="numeric"
        min="1"
        step="1"
        placeholder="المبلغ"
    >


    <button
        id="rechargeBtn"
        type="button"
    >
        شحن الرصيد
    </button>


    <div
        id="message"
        class="message"
    ></div>

</div>


<script type="module">


import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getDatabase,
    ref,
    get,
    runTransaction
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* =========================
   Firebase
========================= */


const firebaseConfig = {

    apiKey:
        "AIzaSyAuWY3OwK9EJnn8vBhz2-yittn7dDntZBw",

    authDomain:
        "bok-jack.firebaseapp.com",

    databaseURL:
        "https://bok-jack-default-rtdb.firebaseio.com",

    projectId:
        "bok-jack",

    storageBucket:
        "bok-jack.firebasestorage.app",

    messagingSenderId:
        "96539205463",

    appId:
        "1:96539205463:web:a2cb846d657aa873182812",

    measurementId:
        "G-069BL15X9J"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getDatabase(app);


/* =========================
   العناصر
========================= */


const accountInput =
    document.getElementById(
        "accountNumber"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const amountInput =
    document.getElementById(
        "amount"
    );


const button =
    document.getElementById(
        "rechargeBtn"
    );


const message =
    document.getElementById(
        "message"
    );


/* =========================
   منع الضغط المكرر
========================= */


let processing = false;


/* =========================
   الشحن
========================= */


button.addEventListener(
    "click",
    async function(){

        if(processing){

            return;

        }


        const accountNumber =
            accountInput.value.trim();


        const password =
            passwordInput.value;


        const amount =
            Number(
                amountInput.value
            );


        message.innerHTML =
            "";


        /* التحقق من رقم الحساب */

        if(
            !/^[0-9]{7}$/.test(
                accountNumber
            )
        ){

            message.innerHTML =
                '<span class="error">' +
                'رقم الحساب يجب أن يكون 7 أرقام' +
                '</span>';

            return;

        }


        /* التحقق من كلمة المرور */

        if(!password){

            message.innerHTML =
                '<span class="error">' +
                'اكتب كلمة المرور' +
                '</span>';

            return;

        }


        /* التحقق من المبلغ */

        if(
            !Number.isFinite(amount) ||
            amount <= 0
        ){

            message.innerHTML =
                '<span class="error">' +
                'أدخل مبلغاً صحيحاً' +
                '</span>';

            return;

        }


        /* منع الضغط مرة ثانية */

        processing = true;

        button.disabled = true;

        button.innerText =
            "جاري الشحن...";


        try{


            /* =========================
               تسجيل الدخول
            ========================= */


            const internalEmail =
                accountNumber +
                "@bokjack.local";


            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    internalEmail,
                    password
                );


            const uid =
                credential.user.uid;


            /* =========================
               بيانات الحساب
            ========================= */


            const userRef =
                ref(
                    db,
                    "users/" +
                    uid
                );


            const snapshot =
                await get(
                    userRef
                );


            if(
                !snapshot.exists()
            ){

                throw new Error(
                    "ACCOUNT_DATA_NOT_FOUND"
                );

            }


            const userData =
                snapshot.val();


            /* التأكد من رقم الحساب */

            if(
                String(
                    userData.accountNumber
                ) !==
                String(
                    accountNumber
                )
            ){

                throw new Error(
                    "ACCOUNT_MISMATCH"
                );

            }


            /* =========================
               إضافة المبلغ مرة واحدة
            ========================= */


            const balanceRef =
                ref(
                    db,
                    "users/" +
                    uid +
                    "/balance"
                );


            const transactionResult =
                await runTransaction(
                    balanceRef,
                    currentBalance => {

                        /*
                         * إذا كان الرصيد غير محدود
                         * فلا نغيره.
                         */

                        if(
                            currentBalance ===
                            "unlimited"
                        ){

                            return "unlimited";

                        }


                        const oldBalance =
                            Number(
                                currentBalance
                            ) || 0;


                        return (
                            oldBalance +
                            amount
                        );

                    }
                );


            if(
                !transactionResult.committed
            ){

                throw new Error(
                    "TRANSACTION_FAILED"
                );

            }


            /* =========================
               قراءة الرصيد الجديد
            ========================= */


            const newSnapshot =
                await get(
                    userRef
                );


            const newData =
                newSnapshot.val();


            const newBalance =
                newData.balance;


            let balanceText;


            if(
                newBalance ===
                "unlimited"
            ){

                balanceText =
                    "♾️ غير محدود";

            }else{

                balanceText =
                    Number(
                        newBalance
                    ).toLocaleString();

            }


            /* =========================
               رسالة النجاح
            ========================= */


            message.innerHTML =

                '<span class="success">' +

                '✅ تم شحن الرصيد بنجاح' +

                '<br><br>' +

                'المبلغ المضاف: ' +

                Number(
                    amount
                ).toLocaleString() +

                '<br><br>' +

                'الرصيد الجديد:' +

                '<br>' +

                '<span class="balance">' +

                balanceText +

                '</span>' +

                '</span>';


            button.innerText =
                "تم الشحن";


            /*
             * تنظيف الحقول
             */

            accountInput.value =
                "";

            passwordInput.value =
                "";

            amountInput.value =
                "";


            /*
             * تسجيل الخروج
             */

            await signOut(auth);


        }catch(error){


            console.error(
                "Recharge Error:",
                error
            );


            message.innerHTML =

                '<span class="error">' +

                '❌ تعذر تنفيذ عملية الشحن' +

                '<br><br>' +

                'تأكد من رقم الحساب وكلمة المرور' +

                '</span>';


            button.disabled =
                false;

            button.innerText =
                "شحن الرصيد";


        }finally{


            processing =
                false;

        }

    }
);

</script>

</body>

</html>
