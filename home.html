<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOK JACK - الرئيسية</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 92%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 5px;
      color: #111;
    }

    .welcome {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      font-size: 15px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 25px;
      margin-bottom: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .label {
      color: #888;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .value {
      color: #111;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .balance-card {
      background: #111;
      color: white;
      border-radius: 22px;
      padding: 28px 24px;
      margin-bottom: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    }

    .balance-title {
      font-size: 14px;
      opacity: .7;
      margin-bottom: 10px;
    }

    .balance {
      font-size: 32px;
      font-weight: bold;
      direction: ltr;
      text-align: center;
      margin: 10px 0;
    }

    .currency {
      text-align: center;
      font-size: 13px;
      opacity: .7;
    }

    .subscription {
      background: #f1f1f1;
      border-radius: 14px;
      padding: 14px;
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      color: #222;
    }

    .status {
      text-align: center;
      font-size: 14px;
      margin-top: 8px;
      color: #555;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .transfer {
      background: #111;
      color: white;
    }

    .logout {
      background: #e9e9e9;
      color: #111;
    }

    .loading {
      text-align: center;
      color: #777;
      font-size: 16px;
    }

    .error {
      text-align: center;
      color: #d00000;
      background: #ffeaea;
      padding: 15px;
      border-radius: 14px;
      display: none;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">JACK</div>
  <div class="welcome">لوحة الحساب</div>

  <div id="loading" class="loading">
    جاري تحميل بيانات الحساب...
  </div>

  <div id="error" class="error"></div>

  <div id="content" style="display:none;">

    <!-- الرصيد -->
    <div class="balance-card">

      <div class="balance-title">
        الرصيد الحالي
      </div>

      <div id="balance" class="balance">
        0
      </div>

      <div class="currency">
        جنيه سوداني
      </div>

      <div id="subscription" class="subscription">
        الاشتراك
      </div>

      <div id="status" class="status">
        جاري التحقق...
      </div>

    </div>

    <!-- معلومات الحساب -->
    <div class="card">

      <div class="label">
        الاسم
      </div>

      <div id="name" class="value">
        -
      </div>

      <div class="label">
        رقم الحساب
      </div>

      <div id="accountNumber" class="value">
        -
      </div>

    </div>

    <!-- الأزرار -->

    <button class="transfer" onclick="goTransfer()">
      تحويل أموال
    </button>

    <button class="logout" onclick="logout()">
      تسجيل الخروج
    </button>

  </div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signOut
  }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getDatabase,
    ref,
    get
  }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


  // ==============================
  // Firebase
  // ==============================

  const firebaseConfig = {

    apiKey: "AIzaSyAuWY3OwK9jnn8vBhz2-yittn7dDntZBw",

    authDomain: "bok-jack.firebaseapp.com",

    databaseURL:
      "https://bok-jack-default-rtdb.firebaseio.com",

    projectId: "bok-jack",

    storageBucket:
      "bok-jack.firebasestorage.app",

    messagingSenderId:
      "96539205463",

    appId:
      "1:96539205463:web:a2cb846d657aa873182812",

    measurementId:
      "G-069BL15X9J"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getDatabase(app);


  // ==============================
  // عناصر الصفحة
  // ==============================

  const loading =
    document.getElementById("loading");

  const errorBox =
    document.getElementById("error");

  const content =
    document.getElementById("content");

  const nameText =
    document.getElementById("name");

  const accountText =
    document.getElementById("accountNumber");

  const balanceText =
    document.getElementById("balance");

  const subscriptionText =
    document.getElementById("subscription");

  const statusText =
    document.getElementById("status");


  // ==============================
  // تنسيق الرصيد
  // ==============================

  function formatMoney(number) {

    return Number(number).toLocaleString("en-US");

  }


  // ==============================
  // تحديد الاشتراك
  // ==============================

  function getSubscriptionName(start, end) {

    const days =
      Math.round(
        (Number(end) - Number(start))
        / (1000 * 60 * 60 * 24)
      );


    if (days <= 1)
      return "اشتراك يوم واحد";

    if (days <= 3)
      return "اشتراك 3 أيام";

    if (days <= 7)
      return "اشتراك 7 أيام";

    if (days <= 30)
      return "اشتراك 30 يوم";

    if (days <= 90)
      return "اشتراك 90 يوم";

    if (days <= 180)
      return "اشتراك 180 يوم";

    return "اشتراك سنة";
  }


  // ==============================
  // تحميل بيانات المستخدم
  // ==============================

  onAuthStateChanged(auth, async (user) => {

    try {

      // لا يوجد تسجيل دخول
      if (!user) {

        window.location.href =
          "login.html";

        return;
      }


      // جلب بيانات المستخدم
      const userRef =
        ref(db, "users/" + user.uid);

      const snapshot =
        await get(userRef);


      if (!snapshot.exists()) {

        throw new Error(
          "بيانات الحساب غير موجودة"
        );

      }


      const data =
        snapshot.val();


      // ==============================
      // الاسم
      // ==============================

      nameText.textContent =
        data.name || "بدون اسم";


      // ==============================
      // رقم الحساب
      // ==============================

      accountText.textContent =
        data.accountNumber || "-";


      // ==============================
      // الرصيد
      // ==============================

      if (data.balanceUnlimited === true) {

        balanceText.textContent =
          "∞";

        document.querySelector(".currency")
          .textContent =
          "رصيد غير محدود";

      } else {

        const balance =
          Number(data.balance || 0);

        balanceText.textContent =
          formatMoney(balance);

        document.querySelector(".currency")
          .textContent =
          "جنيه سوداني";

      }


      // ==============================
      // الاشتراك
      // ==============================

      const start =
        Number(data.subscriptionStart || 0);

      const end =
        Number(data.subscriptionEnd || 0);


      if (data.balanceUnlimited === true) {

        subscriptionText.textContent =
          "اشتراك سنة • رصيد غير محدود";

      } else {

        subscriptionText.textContent =
          getSubscriptionName(start, end);

      }


      // ==============================
      // حالة الاشتراك
      // ==============================

      const now =
        Date.now();


      if (end > now) {

        const remaining =
          Math.ceil(
            (end - now)
            / (1000 * 60 * 60 * 24)
          );


        statusText.textContent =
          "الاشتراك فعال • متبقي " +
          remaining +
          " يوم";

      } else {

        statusText.textContent =
          "الاشتراك منتهي";

      }


      // إظهار الصفحة
      loading.style.display =
        "none";

      content.style.display =
        "block";


    } catch (error) {

      console.error(error);

      loading.style.display =
        "none";

      errorBox.style.display =
        "block";

      errorBox.textContent =
        error.message ||
        "حدث خطأ أثناء تحميل الحساب";

    }

  });


  // ==============================
  // تسجيل الخروج
  // ==============================

  window.logout = async function() {

    try {

      await signOut(auth);

      sessionStorage.clear();

      window.location.href =
        "login.html";

    } catch (error) {

      alert(
        "تعذر تسجيل الخروج"
      );

    }

  };


  // ==============================
  // التحويل
  // ==============================

  window.goTransfer = function() {

    window.location.href =
      "transfer.html";

  };


</script>

</body>
</html>
