  <title>BOK JACK - Admin</title>  <!-- CSS -->  <link rel="stylesheet" href="style.css">
</head><body>  <!-- الخلفية -->  <div class="background"><div class="glow one"></div>
<div class="glow two"></div>

  </div>  <!-- تسجيل دخول الأدمن -->  <main class="login-box"><!-- الشعار -->
<div class="logo">
  BOK
</div>


<!-- العنوان -->
<h1>
  BOK JACK
</h1>

<p class="subtitle">
  لوحة تحكم الإدارة
</p>


<!-- نموذج تسجيل الدخول -->
<form id="loginForm">

  <!-- اسم المستخدم -->
  <div class="field">

    <label for="adminUsername">
      اسم المستخدم
    </label>

    <div class="input-box">

      <input
        type="text"
        id="adminUsername"
        placeholder="أدخل اسم المستخدم"
        autocomplete="username"
        required
      >

    </div>

  </div>


  <!-- كلمة المرور -->
  <div class="field">

    <label for="adminPassword">
      كلمة المرور
    </label>

    <div class="input-box">

      <input
        type="password"
        id="adminPassword"
        class="password-input"
        placeholder="أدخل كلمة المرور"
        autocomplete="current-password"
        required
      >

      <button
        type="button"
        class="show-password"
        id="showPassword"
      >
        إظهار
      </button>

    </div>

  </div>


  <!-- تسجيل الدخول -->
  <button
    type="submit"
    class="login-btn"
  >
    تسجيل الدخول
  </button>


  <!-- رسالة الخطأ -->
  <div
    class="error"
    id="loginError"
  >
    أدخل بيانات تسجيل الدخول.
  </div>

</form>


<!-- أسفل الصفحة -->
<div class="footer">

  BOK JACK

  <span>
    • Admin Panel
  </span>

</div>

  </main>  <!-- JavaScript -->  <script src="app.js"></script></body></html>
