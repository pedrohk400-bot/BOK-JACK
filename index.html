<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>BOK JACK</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    background:#0d1117;

    color:white;

    font-family:Arial,sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

}


.container{

    width:92%;

    max-width:420px;

    text-align:center;

}


.logo{

    font-size:58px;

    font-weight:900;

    letter-spacing:3px;

    margin-bottom:8px;

}


.subtitle{

    color:#8b949e;

    font-size:16px;

    margin-bottom:35px;

}


.buttons{

    display:flex;

    flex-direction:column;

    gap:14px;

}


.btn{

    width:100%;

    padding:16px;

    border-radius:15px;

    border:1px solid #30363d;

    background:#151b23;

    color:white;

    text-decoration:none;

    font-size:17px;

    font-weight:bold;

    transition:.2s;

}


.btn:hover{

    transform:translateY(-2px);

    background:#1c232d;

}


.btn-login{

    background:#b00020;

    border-color:#b00020;

}


.btn-login:hover{

    background:#c40025;

}


.btn-account{

    background:#151b23;

}


.btn-recharge{

    background:#151b23;

}


.footer{

    margin-top:30px;

    color:#666;

    font-size:13px;

}

</style>

</head>


<body>


<div class="container">


    <div class="logo">
        JACK
    </div>


    <div class="subtitle">
        مرحباً بك في BOK JACK
    </div>


    <div class="buttons">


        <!-- تسجيل الدخول -->

        <a
            class="btn btn-login"
            href="login.html"
        >
            تسجيل الدخول
        </a>


        <!-- فتح حساب -->

        <a
            class="btn btn-account"
            href="account.html"
        >
            فتح حساب
        </a>


        <!-- شحن الرصيد -->

        <a
            class="btn btn-recharge"
            href="recharge.html"
        >
            شحن الرصيد
        </a>


    </div>


    <div class="footer">
        BOK JACK
    </div>


</div>


</body>

</html>
