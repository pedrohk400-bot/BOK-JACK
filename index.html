  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">  <title>BOK JACK - Admin</title>  <link rel="stylesheet" href="style.css">
</head><body>  <div class="background">
    <div class="glow one"></div>
    <div class="glow two"></div>
  </div>  <main class="login-box"><div class="logo">
  BOK
</div>

<h1>BOK JACK</h1>

<p class="subtitle">
  لوحة تحكم الإدارة
</p>

<form id="loginForm">

  <div class="field">

    <label for="adminUsername">
      البريد الإلكتروني للأدمن
    </label>

    <div class="input-box">

      <input
        type="email"
        id="adminUsername"
        placeholder="أدخل البريد الإلكتروني"
        autocomplete="username"
        required
      >

    </div>

  </div>

  <div class="field">

    <label for="adminPassword">
      كلمة المرور
    </label>

    <div class="input-box">

      <input
        type="password"
        id="adminPassword"
        class="password-input"
        placeholder="أدخل كلمة المرور"
        autocomplete="current-password"
        required
      >

      <button
        type="button"
        class="show-password"
        id="showPassword"
      >
        إظهار
      </button>

    </div>

  </div>

  <button
    type="submit"
    class="login-btn"
    id="loginButton"
  >
    تسجيل الدخول
  </button>

  <div
    class="error"
    id="loginError"
  ></div>

</form>

<div class="footer">
  BOK JACK
  <span>• Admin Panel</span>
</div>
