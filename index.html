<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JACK</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080b12;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            align-items: center;

            padding-top: 80px;
        }

        .logo {
            font-size: 60px;
            font-weight: 900;

            letter-spacing: 6px;

            margin-bottom: 60px;
        }

        .buttons {
            width: 90%;
            max-width: 380px;

            display: flex;
            flex-direction: column;

            gap: 18px;
        }

        .button {
            width: 100%;

            padding: 18px;

            border-radius: 15px;

            border: 1px solid #303746;

            background: #151a24;

            color: white;

            text-decoration: none;

            text-align: center;

            font-size: 18px;
            font-weight: bold;

            transition: 0.2s;
        }

        .button:hover {
            background: #202735;
            transform: translateY(-2px);
        }

        .button:active {
            transform: scale(0.98);
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="logo">
            JACK
        </div>

        <div class="buttons">

            <a href="recharge.html" class="button">
                شحن الرصيد
            </a>

            <a href="account.html" class="button">
                فتح حساب
            </a>

        </div>

    </div>

</body>

</html>
