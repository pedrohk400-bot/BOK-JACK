<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>BOK JACK - إنشاء حساب</title>

<style>

*{
    box-sizing:border-box;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        Arial,
        sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:#000;
    color:#fff;
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:25px 18px 40px;
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.logo{
    font-size:30px;
    font-weight:800;
    letter-spacing:1px;
}

.subtitle{
    color:#888;
    margin-top:7px;
    font-size:14px;
}

.card{
    background:#111;
    border:1px solid #292929;
    border-radius:22px;
    padding:22px;
    box-shadow:
        0 10px 35px rgba(0,0,0,.45);
}

.title{
    font-size:21px;
    font-weight:700;
    margin-bottom:22px;
}

.input-group{
    margin-bottom:17px;
}

label{
    display:block;
    color:#aaa;
    font-size:13px;
    margin-bottom:8px;
}

input{
    width:100%;
    height:52px;
    border-radius:14px;
    border:1px solid #303030;
    background:#181818;
    color:#fff;
    padding:0 15px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#777;
}

input::placeholder{
    color:#666;
}

input[readonly]{
    color:#aaa;
    background:#141414;
}

button{
    width:100%;
    height:54px;
    border:0;
    border-radius:15px;
    background:#fff;
    color:#000;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-top:8px;
}

button:active{
    transform:scale(.98);
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-top:18px;
    padding:13px;
    border-radius:12px;
    text-align:center;
    font-size:14px;
}

.success{
    display:block;
    background:#102315;
    color:#5cff82;
    border:1px solid #1e5c30;
}

.error{
    display:block;
    background:#261010;
    color:#ff6868;
    border:1px solid #5c2222;
}

.account-box{
    display:none;
    margin-top:18px;
    padding:15px;
    border-radius:14px;
    background:#181818;
    border:1px solid #303030;
}

.account-box div{
    margin:8px 0;
}

.account-value{
    color:#fff;
    font-weight:700;
}

.back{
    display:block;
    text-align:center;
    color:#888;
    text-decoration:none;
    margin-top:22px;
    font-size:14px;
}

.back:hover{
    color:#fff;
}

</style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            BOK
        </div>

        <div class="subtitle">
            لوحة إدارة الحسابات
        </div>

    </div>


    <!-- CARD -->

    <div class="card">


        <div class="title">
            إنشاء حساب جديد
        </div>


        <!-- NAME -->

        <div class="input-group">

            <label>
                اسم المستخدم
            </label>

            <input
                type="text"
                id="name"
                placeholder="أدخل اسم المستخدم"
                autocomplete="off"
            >

        </div>


        <!-- ACCOUNT NUMBER -->

        <div class="input-group">

            <label>
                رقم الحساب
            </label>

            <input
                type="text"
                id="account"
                value="سيتم إنشاء الرقم تلقائياً"
                readonly
            >

        </div>


        <!-- PASSWORD -->

        <div class="input-group">

            <label>
                كلمة المرور
            </label>

            <input
                type="password"
                id="password"
                placeholder="4 أرقام أو أكثر"
                inputmode="numeric"
                autocomplete="new-password"
            >

        </div>


        <!-- BALANCE -->

        <div class="input-group">

            <label>
                الرصيد الابتدائي
            </label>

            <input
                type="number"
                id="balance"
                placeholder="0"
                min="0"
                value="0"
            >

        </div>


        <!-- BUTTON -->

        <button
            id="createBtn"
            onclick="createAccount()"
        >
            إنشاء الحساب
        </button>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- RESULT -->

        <div
            id="accountBox"
            class="account-box"
        >

            <div>

                اسم المستخدم:

                <span
                    id="showName"
                    class="account-value"
                ></span>

            </div>


            <div>

                رقم الحساب:

                <span
                    id="showAccount"
                    class="account-value"
                ></span>

            </div>


            <div>

                الرصيد:

                <span
                    id="showBalance"
                    class="account-value"
                ></span>

            </div>

        </div>


    </div>


    <!-- BACK -->

    <a
        href="dashboard.html"
        class="back"
    >
        ← العودة إلى لوحة الإدارة
    </a>


</div>



<script type="module">


/* =========================
   FIREBASE APP
========================= */

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


/* =========================
   FIREBASE DATABASE
========================= */

import {
    getDatabase,
    ref,
    get,
    set
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =========================
   FIREBASE AUTH
========================= */

import {
    getAuth,
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyAuWY3OwE9Kjnn8vBhz2-yittn7dDntZBw",

    authDomain:
    "bok-jack.firebaseapp.com",

    databaseURL:
    "https://bok-jack-default-rtdb.firebaseio.com",

    projectId:
    "bok-jack",

    storageBucket:
    "bok-jack.firebasestorage.app",

    messagingSenderId:
    "96539205463",

    appId:
    "1:96539205463:web:a2cb846d657aa873182812",

    measurementId:
    "G-069BL15X9J"

};



/* =========================
   INITIALIZE
========================= */

const app =
    initializeApp(firebaseConfig);


const db =
    getDatabase(app);


const auth =
    getAuth(app);



/* =========================
   ADMIN UID
========================= */

const ADMIN_UID =
    "qlaCFjAGCPPrg53Z7nCl5NDbAw62";


let adminReady =
    false;



/* =========================
   CHECK ADMIN LOGIN
========================= */

onAuthStateChanged(
    auth,
    function(user){

        if(!user){

            window.location.href =
                "index.html";

            return;
        }


        if(user.uid !== ADMIN_UID){

            showError(
                "هذا الحساب غير مصرح له بإدارة النظام"
            );

            adminReady =
                false;

            return;
        }


        adminReady =
            true;

    }
);



/* =========================
   GENERATE ACCOUNT NUMBER
========================= */

async function generateAccountNumber(){

    let accountNumber;

    let exists = true;


    while(exists){

        accountNumber =
            Math.floor(
                1000000 +
                Math.random() * 9000000
            ).toString();


        const accountRef =
            ref(
                db,
                "accounts/" + accountNumber
            );


        const snapshot =
            await get(accountRef);


        exists =
            snapshot.exists();

    }


    return accountNumber;

}



/* =========================
   CREATE ACCOUNT
========================= */

window.createAccount =
async function(){


    /* =========================
       CHECK ADMIN
    ========================= */

    if(!adminReady){

        showError(
            "يرجى تسجيل الدخول كأدمن أولاً"
        );

        return;

    }



    /* =========================
       GET VALUES
    ========================= */

    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value
        .trim();


    const balanceValue =
        document
        .getElementById("balance")
        .value
        .trim();



    const btn =
        document
        .getElementById("createBtn");


    const message =
        document
        .getElementById("message");


    const accountBox =
        document
        .getElementById("accountBox");



    /* =========================
       RESET MESSAGE
    ========================= */

    message.className =
        "message";

    message.style.display =
        "none";


    accountBox.style.display =
        "none";



    /* =========================
       VALIDATE NAME
    ========================= */

    if(name === ""){

        showError(
            "أدخل اسم المستخدم"
        );

        return;

    }



    /* =========================
       VALIDATE PASSWORD
    ========================= */

    if(password.length < 4){

        showError(
            "كلمة المرور يجب أن تكون 4 أرقام أو أكثر"
        );

        return;

    }


    if(!/^[0-9]+$/.test(password)){

        showError(
            "كلمة المرور يجب أن تحتوي على أرقام فقط"
        );

        return;

    }



    /* =========================
       VALIDATE BALANCE
    ========================= */

    const balance =
        Number(
            balanceValue || 0
        );


    if(
        !Number.isFinite(balance) ||
        balance < 0
    ){

        showError(
            "الرصيد غير صحيح"
        );

        return;

    }



    /* =========================
       BUTTON LOADING
    ========================= */

    btn.disabled =
        true;


    btn.textContent =
        "جاري إنشاء الحساب...";



    try{


        /* =========================
           GENERATE ACCOUNT
        ========================= */

        const account =
            await generateAccountNumber();



        /* =========================
           SHOW ACCOUNT NUMBER
        ========================= */

        document
        .getElementById("account")
        .value =
            account;



        /* =========================
           ACCOUNT REF
        ========================= */

        const accountRef =
            ref(
                db,
                "accounts/" + account
            );



        /* =========================
           ACCOUNT DATA
        ========================= */

        const accountData = {

            name:
                name,

            account:
                account,

            password:
                password,

            balance:
                balance,

            active:
                true,

            createdAt:
                Date.now()

        };



        /* =========================
           SAVE
        ========================= */

        await set(
            accountRef,
            accountData
        );



        /* =========================
           SHOW RESULT
        ========================= */

        document
        .getElementById("showName")
        .textContent =
            name;


        document
        .getElementById("showAccount")
        .textContent =
            account;


        document
        .getElementById("showBalance")
        .textContent =
            balance.toLocaleString(
                "en-US"
            );



        accountBox.style.display =
            "block";



        message.textContent =
            "تم إنشاء الحساب بنجاح ✓";


        message.className =
            "message success";


        message.style.display =
            "block";



        /* =========================
           CLEAR FIELDS
        ========================= */

        document
        .getElementById("name")
        .value =
            "";


        document
        .getElementById("password")
        .value =
            "";


        document
        .getElementById("balance")
        .value =
            "0";



    }
    catch(error){


        console.error(
            "Firebase Error:",
            error
        );


        console.error(
            "Firebase Error Code:",
            error.code
        );


        showError(
            "حدث خطأ: " +
            (
                error.message ||
                "تعذر إنشاء الحساب"
            )
        );

    }



    btn.disabled =
        false;


    btn.textContent =
        "إنشاء الحساب";

};



/* =========================
   ERROR MESSAGE
========================= */

function showError(text){

    const message =
        document
        .getElementById("message");


    message.textContent =
        text;


    message.className =
        "message error";


    message.style.display =
        "block";

}



/* =========================
   PASSWORD NUMBERS ONLY
========================= */

document
.getElementById("password")
.addEventListener(
    "input",
    function(){

        this.value =
            this.value.replace(
                /[^0-9]/g,
                ""
            );

    }
);


</script>


</body>

</html>
