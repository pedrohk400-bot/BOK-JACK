<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOK JACK - الحسابات</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#000;color:#fff}
.container{max-width:600px;margin:auto;padding:25px 16px}
.header{text-align:center;margin-bottom:25px}
.logo{font-size:30px;font-weight:800}
.subtitle{color:#888;font-size:14px;margin-top:5px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.title{font-size:21px;font-weight:bold}
.back{color:#aaa;text-decoration:none}
.btn,.refresh,.delete{width:100%;height:50px;border-radius:14px;font-weight:bold;font-size:14px;cursor:pointer}
.btn{display:block;text-align:center;line-height:50px;text-decoration:none;background:#fff;color:#000;margin-bottom:15px}
.refresh{background:#151515;color:#fff;border:1px solid #333;margin-bottom:15px}
.search{width:100%;height:50px;background:#151515;color:#fff;border:1px solid #333;border-radius:14px;padding:0 15px;font-size:15px;outline:0;margin-bottom:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:15px}
.stat,.card,.empty{background:#111;border:1px solid #292929;border-radius:18px}
.stat{padding:15px}
.label{color:#888;font-size:13px}
.value{font-size:22px;font-weight:bold;margin-top:6px}
.card{padding:17px;margin-bottom:12px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.name{font-size:18px;font-weight:bold}
.status{padding:6px 10px;border-radius:20px;font-size:12px}
.active{color:#5cff82;background:#102315}
.off{color:#ff6868;background:#261010}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #222}
.row span:first-child{color:#888}
.balance{font-size:19px;font-weight:bold}
.delete{height:43px;background:#261010;color:#ff6868;border:1px solid #5c2222;margin-top:13px}
.loading,.empty{text-align:center;padding:30px;color:#888}
.empty{display:none}
.error{display:none;background:#261010;color:#ff6868;padding:13px;border-radius:13px;margin-bottom:15px;text-align:center}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="logo">BOK</div>
<div class="subtitle">لوحة إدارة الحسابات</div>
</div>

<div class="top">
<div class="title">الحسابات</div>
<a class="back" href="dashboard.html">← لوحة الإدارة</a>
</div>

<a class="btn" href="create-account.html">+ إنشاء حساب جديد</a>

<div class="stats">
<div class="stat">
<div class="label">إجمالي الحسابات</div>
<div class="value" id="total">0</div>
</div>
<div class="stat">
<div class="label">الحسابات النشطة</div>
<div class="value" id="active">0</div>
</div>
</div>

<input
class="search"
id="search"
placeholder="بحث بالاسم أو رقم الحساب..."
>

<button class="refresh" id="refresh">↻ تحديث الحسابات</button>

<div class="error" id="error"></div>

<div class="loading" id="loading">
جاري تحميل الحسابات...
</div>

<div id="list"></div>

<div class="empty" id="empty">
لا توجد حسابات حالياً
</div>

</div>

<script type="module">

import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,get,remove}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const config={
apiKey:"AIzaSyAuWY3OwE9Kjnn8vBhz2-yittn7dDntZBw",
authDomain:"bok-jack.firebaseapp.com",
databaseURL:"https://bok-jack-default-rtdb.firebaseio.com",
projectId:"bok-jack",
storageBucket:"bok-jack.firebasestorage.app",
messagingSenderId:"96539205463",
appId:"1:96539205463:web:a2cb846d657aa873182812"
};

const app=initializeApp(config);
const db=getDatabase(app);
const auth=getAuth(app);
const ADMIN="rneRJQbNLNWUGyRbDs2ocI37R392";

let accounts=[];

onAuthStateChanged(auth,user=>{
if(!user){
location.href="index.html";
return;
}
if(user.uid!==ADMIN){
showError("هذا الحساب غير مصرح له");
return;
}
load();
});

async function load(){

loading.style.display="block";
list.innerHTML="";
empty.style.display="none";
error.style.display="none";

try{

const snap=await get(ref(db,"accounts"));
accounts=[];

if(snap.exists()){

const data=snap.val();

Object.keys(data).forEach(key=>{

const a=data[key]||{};

accounts.push({
id:key,
name:a.name||"بدون اسم",
account:String(a.account||a.accountNumber||key),
balance:Number(a.balance||0),
active:a.active!==false&&a.active!=="false",
createdAt:Number(a.createdAt||0)
});

});

}

document.getElementById("total").textContent=accounts.length;

document.getElementById("active").textContent=
accounts.filter(a=>a.active).length;

render(accounts);

}catch(e){

showError("خطأ: "+e.message);

}

loading.style.display="none";
}

function render(arr){

list.innerHTML="";

if(!arr.length){
empty.style.display="block";
return;
}

empty.style.display="none";

arr.forEach(a=>{

const card=document.createElement("div");
card.className="card";

const date=a.createdAt?
new Date(a.createdAt).toLocaleString("ar-SD"):
"غير معروف";

card.innerHTML=`

<div class="head">
<div class="name">${esc(a.name)}</div>
<div class="status ${a.active?"active":"off"}">
${a.active?"نشط":"متوقف"}
</div>
</div>

<div class="row">
<span>رقم الحساب</span>
<span>${esc(a.account)}</span>
</div>

<div class="row">
<span>الرصيد</span>
<span class="balance">${a.balance.toLocaleString("en-US")}</span>
</div>

<div class="row">
<span>تاريخ الإنشاء</span>
<span>${esc(date)}</span>
</div>

<button class="delete">حذف حساب</button>
`;

card.querySelector(".delete").onclick=async e=>{

e.stopPropagation();

if(!confirm(
"حذف الحساب؟\n\n"+
a.name+"\n"+
a.account
))return;

try{

await remove(ref(db,"accounts/"+a.id));

alert("تم حذف الحساب بنجاح");
load();

}catch(err){

showError("فشل الحذف: "+err.message);

}

};

list.appendChild(card);

});

}

search.oninput=()=>{

const q=search.value.trim().toLowerCase();

render(
accounts.filter(a=>
a.name.toLowerCase().includes(q)||
a.account.toLowerCase().includes(q)
)
);

};

refresh.onclick=load;

function esc(x){

const d=document.createElement("div");
d.textContent=String(x);
return d.innerHTML;

}

function showError(x){

error.textContent=x;
error.style.display="block";

}

</script>

</body>
</html>
