<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فتح حساب - BOK JACK</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0d1117;
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:92%;
    max-width:420px;
    background:#151b23;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.4);
}

.logo{
    text-align:center;
    font-size:34px;
    font-weight:bold;
    margin-bottom:5px;
}

.sub{
    text-align:center;
    color:#aaa;
    margin-bottom:25px;
}

input,
button{
    width:100%;
    padding:14px;
    border-radius:12px;
    font-size:16px;
    margin-top:12px;
}

input{
    background:#0d1117;
    border:1px solid #30363d;
    color:white;
    outline:none;
}

button{
    border:0;
    background:#b00020;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.plan{
    border:1px solid #30363d;
    padding:14px;
    border-radius:12px;
    margin-top:10px;
    cursor:pointer;
    transition:.2s;
}

.plan.selected{
    border-color:#b00020;
    background:#251017;
}

.plan-title{
    font-weight:bold;
}

.plan-balance{
    color:#aaa;
    margin-top:5px;
    font-size:14px;
}

.message{
    margin-top:15px;
    text-align:center;
    line-height:1.8;
}

.success{
    color:#35d07f;
}

.error{
    color:#ff5c5c;
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">JACK</div>

    <div class="sub">
        فتح حساب جديد
    </div>

    <input
        id="name"
        type="text"
        placeholder="الاسم"
    >

    <input
        id="password"
        type="password"
        placeholder="كلمة المرور"
    >

    <input
        id="confirmPassword"
        type="password"
        placeholder="تأكيد كلمة المرور"
    >

    <div style="margin-top:20px;font-weight:bold;">
        اختر مدة الاشتراك
    </div>

    <div class="plan selected" data-days="1" data-balance="100000">
        <div class="plan-title">يوم واحد</div>
        <div class="plan-balance">
            الرصيد: 100,000
        </div>
    </div>

    <div class="plan" data-days="3" data-balance="300000">
        <div class="plan-title">3 أيام</div>
        <div class="plan-balance">
            الرصيد: 300,000
        </div>
    </div>

    <div class="plan" data-days="7" data-balance="700000">
        <div class="plan-title">أسبوع</div>
        <div class="plan-balance">
            الرصيد: 700,000
        </div>
    </div>

    <div class="plan" data-days="30" data-balance="2000000">
        <div class="plan-title">شهر</div>
        <div class="plan-balance">
            الرصيد: 2,000,000
        </div>
    </div>

    <div class="plan" data-days="90" data-balance="100000000">
        <div class="plan-title">3 شهور</div>
        <div class="plan-balance">
            الرصيد: 100,000,000
        </div>
    </div>

    <div class="plan" data-days="180" data-balance="500000000">
        <div class="plan-title">6 شهور</div>
        <div class="plan-balance">
            الرصيد: 500,000,000
        </div>
    </div>

    <div class="plan" data-days="365" data-balance="unlimited">
        <div class="plan-title">12 شهر</div>
        <div class="plan-balance">
            الرصيد: ♾️ غير محدود
        </div>
    </div>

    <button id="createBtn">
        فتح الحساب
    </button>

    <div id="message" class="message"></div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    deleteUser
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    set,
    runTransaction
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* Firebase */

const firebaseConfig = {

    apiKey:
        "AIzaSyAuWY3OwE9Kjnn8vBhz2-yittn7dDntZBw",

    authDomain:
        "bok-jack.firebaseapp.com",

    databaseURL:
        "https://bok-jack-default-rtdb.firebaseio.com",

    projectId:
        "bok-jack",

    storageBucket:
        "bok-jack.firebasestorage.app",

    messagingSenderId:
        "96539205463",

    appId:
        "1:96539205463:web:a2cb846d657aa873182812",

    measurementId:
        "G-069BL15X9J"
};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getDatabase(app);


/* القيم الافتراضية */

let selectedDays = 1;
let selectedBalance = 100000;


/* اختيار الاشتراك */

document
.querySelectorAll(".plan")
.forEach(plan => {

    plan.addEventListener("click", () => {

        document
        .querySelectorAll(".plan")
        .forEach(p => {

            p.classList.remove("selected");

        });


        plan.classList.add("selected");


        selectedDays =
            Number(plan.dataset.days);


        if(plan.dataset.balance === "unlimited"){

            selectedBalance =
                "unlimited";

        }else{

            selectedBalance =
                Number(plan.dataset.balance);

        }

    });

});


/* إنشاء رقم حساب 7 أرقام */

function generateAccountNumber(){

    return String(
        Math.floor(
            1000000 +
            Math.random() * 9000000
        )
    );

}


/* إنشاء الحساب */

document
.getElementById("createBtn")
.addEventListener("click", async () => {


    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;


    const message =
        document
        .getElementById("message");


    const button =
        document
        .getElementById("createBtn");


    message.innerHTML = "";


    /* التحقق */

    if(!name){

        message.innerHTML =
            '<span class="error">' +
            'اكتب الاسم' +
            '</span>';

        return;

    }


    if(password.length < 4){

        message.innerHTML =
            '<span class="error">' +
            'كلمة المرور يجب أن تكون 4 أحرف/أرقام على الأقل' +
            '</span>';

        return;

    }


    if(password !== confirmPassword){

        message.innerHTML =
            '<span class="error">' +
            'كلمتا المرور غير متطابقتين' +
            '</span>';

        return;

    }


    button.disabled = true;

    button.innerText =
        "جاري إنشاء الحساب...";


    let createdUser = null;


    try {


        /* إنشاء رقم الحساب */

        const accountNumber =
            generateAccountNumber();


        /*
         * إيميل داخلي مخفي
         *
         * المستخدم لن يراه.
         */

        const internalEmail =
            accountNumber +
            "@bokjack.local";


        /* إنشاء Firebase Auth */

        const credential =
            await createUserWithEmailAndPassword(
                auth,
                internalEmail,
                password
            );


        createdUser =
            credential.user;


        const uid =
            createdUser.uid;


        /*
         * حجز رقم الحساب
         */

        const accountRef =
            ref(
                db,
                "accountNumbers/" +
                accountNumber
            );


        const result =
            await runTransaction(
                accountRef,
                currentData => {

                    if(currentData !== null){

                        return;

                    }

                    return {
                        uid: uid
                    };

                }
            );


        if(!result.committed){

            throw new Error(
                "ACCOUNT_EXISTS"
            );

        }


        /* الوقت الحالي */

        const now =
            Date.now();


        /* نهاية الاشتراك */

        const subscriptionEnd =
            now +
            selectedDays *
            24 *
            60 *
            60 *
            1000;


        /*
         * بيانات المستخدم
         */

        await set(

            ref(
                db,
                "users/" + uid
            ),

            {

                accountNumber:
                    accountNumber,

                name:
                    name,

                /*
                 * الرصيد يعتمد على الاشتراك
                 */

                balance:
                    selectedBalance,

                subscriptionStart:
                    now,

                subscriptionEnd:
                    subscriptionEnd

            }

        );


        /* رسالة النجاح */

        let balanceText;


        if(selectedBalance === "unlimited"){

            balanceText =
                "♾️ غير محدود";

        }else{

            balanceText =
                Number(
                    selectedBalance
                ).toLocaleString();

        }


        message.innerHTML =

            '<span class="success">' +

            '✅ تم إنشاء الحساب بنجاح!' +

            '<br><br>' +

            'رقم الحساب:' +

            '<br>' +

            '<strong style="font-size:28px">' +

            accountNumber +

            '</strong>' +

            '<br><br>' +

            'مدة الاشتراك: ' +

            selectedDays +

            ' يوم' +

            '<br><br>' +

            'الرصيد:' +

            '<br>' +

            '<strong style="font-size:24px">' +

            balanceText +

            '</strong>' +

            '</span>';


        button.innerText =
            "تم إنشاء الحساب";


    }catch(error){


        console.error(error);


        /*
         * حذف حساب Auth إذا فشلت العملية
         */

        if(createdUser){

            try{

                await deleteUser(
                    createdUser
                );

            }catch(e){

                console.error(e);

            }

        }


        message.innerHTML =

            '<span class="error">' +

            '❌ حدث خطأ أثناء إنشاء الحساب' +

            '<br>' +

            error.message +

            '</span>';


        button.disabled =
            false;

        button.innerText =
            "فتح الحساب";

    }

});

</script>

</body>
</html>
