<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOK JACK - فتح حساب</title>

<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
body{
margin:0;min-height:100vh;background:#000;color:#fff;
background:radial-gradient(circle at 50% 5%,#252525,#0b0b0b 40%,#000 75%);
}
.page{max-width:430px;margin:auto;padding:35px 20px}
.top{text-align:center;margin-bottom:25px}
.logo{font-size:44px;font-weight:800;letter-spacing:5px}
.subtitle{margin-top:8px;color:#8e8e93;font-size:14px}

.card{
background:rgba(255,255,255,.07);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;padding:22px;
box-shadow:0 25px 70px rgba(0,0,0,.7);
backdrop-filter:blur(30px);
}

label{display:block;color:#aaa;font-size:13px;margin-bottom:8px}

input{
width:100%;height:54px;margin-bottom:18px;padding:0 15px;
border:1px solid rgba(255,255,255,.1);
border-radius:16px;background:rgba(255,255,255,.07);
color:#fff;font-size:16px;outline:none;
}

.section-title{font-size:17px;font-weight:700;margin:5px 0 14px}

.plans{display:flex;flex-direction:column;gap:10px}

.plan{
display:flex;align-items:center;justify-content:space-between;
padding:15px;min-height:62px;border-radius:18px;
background:rgba(255,255,255,.055);
border:1px solid rgba(255,255,255,.08);
cursor:pointer;
}

.plan.selected{
background:rgba(255,255,255,.14);
border-color:#fff;
}

.plan-left{display:flex;align-items:center;gap:12px}
.radio{
width:20px;height:20px;border-radius:50%;
border:2px solid #666;
display:flex;align-items:center;justify-content:center;
}
.plan.selected .radio{border-color:#fff}
.plan.selected .radio:after{
content:"";width:10px;height:10px;border-radius:50%;background:#fff;
}

.plan-name{font-size:15px;font-weight:600}
.plan-balance{color:#aaa;font-size:13px;direction:ltr}

button{
width:100%;height:54px;border-radius:17px;font-size:16px;font-weight:700;
cursor:pointer;
}

.create{margin-top:18px;border:0;background:#fff;color:#000}
.create:disabled{opacity:.5}

.back{
margin-top:12px;border:1px solid rgba(255,255,255,.1);
background:rgba(255,255,255,.06);color:#fff;
}

.message{
display:none;margin-top:15px;padding:14px;border-radius:15px;
text-align:center;font-size:14px;line-height:1.6;
}
.message.success{
display:block;background:rgba(50,200,100,.12);
color:#70e090;border:1px solid rgba(50,200,100,.2);
}
.message.error{
display:block;background:rgba(255,50,50,.1);
color:#ff7070;border:1px solid rgba(255,50,50,.2);
}

.result{
display:none;margin-top:18px;padding:18px;border-radius:18px;
background:rgba(255,255,255,.07);text-align:center;
}
.account-number{
font-size:28px;font-weight:800;letter-spacing:4px;
direction:ltr;margin:10px 0;
}
.result small{color:#aaa;line-height:1.8}
</style>
</head>

<body>

<div class="page">

<div class="top">
<div class="logo">JACK</div>
<div class="subtitle">فتح حساب جديد</div>
</div>

<div class="card">

<label>الاسم</label>
<input id="name" type="text" placeholder="اكتب اسمك">

<label>كلمة المرور</label>
<input id="password" type="password"
       inputmode="numeric"
       maxlength="20"
       placeholder="4 أرقام أو أكثر">

<div class="section-title">اختر الاشتراك</div>

<div class="plans">

<div class="plan" data-days="1" data-balance="100000">
<div class="plan-left"><div class="radio"></div><div class="plan-name">يوم واحد</div></div>
<div class="plan-balance">100,000 SDG</div>
</div>

<div class="plan" data-days="3" data-balance="300000">
<div class="plan-left"><div class="radio"></div><div class="plan-name">3 أيام</div></div>
<div class="plan-balance">300,000 SDG</div>
</div>

<div class="plan" data-days="7" data-balance="700000">
<div class="plan-left"><div class="radio"></div><div class="plan-name">7 أيام</div></div>
<div class="plan-balance">700,000 SDG</div>
</div>

<div class="plan" data-days="30" data-balance="2000000">
<div class="plan-left"><div class="radio"></div><div class="plan-name">30 يوم</div></div>
<div class="plan-balance">2,000,000 SDG</div>
</div>

<div class="plan" data-days="90" data-balance="100000000">
<div class="plan-left"><div class="radio"></div><div class="plan-name">90 يوم</div></div>
<div class="plan-balance">100,000,000 SDG</div>
</div>

<div class="plan" data-days="180" data-balance="500000000">
<div class="plan-left"><div class="radio"></div><div class="plan-name">180 يوم</div></div>
<div class="plan-balance">500,000,000 SDG</div>
</div>

<div class="plan" data-days="365" data-balance="unlimited">
<div class="plan-left"><div class="radio"></div><div class="plan-name">سنة كاملة</div></div>
<div class="plan-balance">∞ غير محدود</div>
</div>

</div>

<button id="createBtn" class="create">فتح الحساب</button>
<button id="backBtn" class="back">رجوع</button>

<div id="message" class="message"></div>

<div id="result" class="result">
<small>تم إنشاء حسابك بنجاح</small>
<div id="newAccount" class="account-number"></div>
<small>استخدم رقم الحساب وكلمة المرور لتسجيل الدخول</small>
</div>

</div>
</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getDatabase,
ref,
set
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig={
apiKey:"AIzaSyAuWY3OwK9EJnn8vBhz2-yittn7dDntZBw",
authDomain:"bok-jack.firebaseapp.com",
databaseURL:"https://bok-jack-default-rtdb.firebaseio.com",
projectId:"bok-jack",
storageBucket:"bok-jack.firebasestorage.app",
messagingSenderId:"96539205463",
appId:"1:96539205463:web:a2cb846d657aa873182812",
measurementId:"G-069BL15X9J"
};


const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

let selectedPlan=null;

const plans=document.querySelectorAll(".plan");
const nameInput=document.getElementById("name");
const passwordInput=document.getElementById("password");
const createBtn=document.getElementById("createBtn");
const backBtn=document.getElementById("backBtn");
const message=document.getElementById("message");
const result=document.getElementById("result");
const newAccount=document.getElementById("newAccount");


plans.forEach(plan=>{
plan.onclick=()=>{
plans.forEach(p=>p.classList.remove("selected"));
plan.classList.add("selected");

selectedPlan={
days:Number(plan.dataset.days),
balance:plan.dataset.balance
};
};
});


function generateAccount(){
return String(
Math.floor(1000000+Math.random()*9000000)
);
}


function showMessage(text,type){
message.textContent=text;
message.className="message "+type;
}


createBtn.onclick=async()=>{

message.className="message";
result.style.display="none";

const name=nameInput.value.trim();
const password=passwordInput.value.trim();

if(!name){
showMessage("اكتب الاسم أولاً","error");
return;
}

if(!/^[0-9]{4,20}$/.test(password)){
showMessage("كلمة المرور يجب أن تكون من 4 إلى 20 رقمًا","error");
return;
}

if(!selectedPlan){
showMessage("اختر الاشتراك أولاً","error");
return;
}

createBtn.disabled=true;
createBtn.textContent="جاري إنشاء الحساب...";


try{

/* ==============================
   إنشاء رقم الحساب
============================== */

const accountNumber=generateAccount();


/* ==============================
   البريد الداخلي
============================== */

const email=accountNumber+"@bokjack.local";


/* ==============================
   إنشاء Firebase Authentication
============================== */

const credential=
await createUserWithEmailAndPassword(
auth,
email,
password
);

const uid=credential.user.uid;


/* ==============================
   الوقت والاشتراك
============================== */

const now=Date.now();

const end=
now+
selectedPlan.days*
24*
60*
60*
1000;


const unlimited=
selectedPlan.balance==="unlimited";

const balance=
unlimited
?0
:Number(selectedPlan.balance);


/* ==============================
   حفظ المستخدم
============================== */

await set(
ref(db,"users/"+uid),
{
accountNumber:accountNumber,
name:name,
balance:balance,
balanceUnlimited:unlimited,
subscriptionStart:now,
subscriptionEnd:end
}
);


/* ==============================
   ربط رقم الحساب بالـ UID
============================== */

await set(
ref(db,"accountNumbers/"+accountNumber),
{
uid:uid
}
);


/* ==============================
   نجاح
============================== */

newAccount.textContent=accountNumber;

result.style.display="block";

showMessage(
"تم إنشاء الحساب بنجاح",
"success"
);

createBtn.textContent="تم إنشاء الحساب";


/* حفظ الرقم مؤقتًا */

sessionStorage.setItem(
"newAccountNumber",
accountNumber
);


/* الانتقال */

setTimeout(()=>{
window.location.href="login.html";
},3000);


}catch(error){

console.error("CREATE ACCOUNT ERROR:",error);

let text="تعذر إنشاء الحساب";

if(error.code==="auth/email-already-in-use"){
text="حدث تعارض في رقم الحساب، اضغط فتح الحساب مرة أخرى";
}

else if(error.code==="auth/operation-not-allowed"){
text="Email/Password غير مفعل في Firebase Authentication";
}

else if(error.code==="auth/weak-password"){
text="كلمة المرور ضعيفة";
}

else if(error.code==="auth/network-request-failed"){
text="مشكلة في الإنترنت";
}

else if(
error.code==="PERMISSION_DENIED" ||
error.code==="database/permission-denied"
){
text="Firebase رفض حفظ البيانات. راجع Rules";
}

else if(error.message){
text="خطأ Firebase: "+error.message;
}

showMessage(text,"error");

createBtn.disabled=false;
createBtn.textContent="فتح الحساب";

}

};


backBtn.onclick=()=>{
window.location.href="index.html";
};

</script>

</body>
</html>
