<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <meta name="theme-color" content="#000000">

  <title>BOK JACK - فتح حساب</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #000;
    }

    body {

      min-height: 100vh;

      color: #fff;

      background:
        radial-gradient(
          circle at 50% 5%,
          #252525 0%,
          #0c0c0c 35%,
          #000 75%
        );
    }

    .page {

      width: 100%;
      max-width: 430px;

      min-height: 100vh;

      margin: auto;

      padding: 35px 20px 30px;
    }

    .top {

      text-align: center;

      margin-bottom: 25px;
    }

    .logo {

      font-size: 44px;

      font-weight: 800;

      letter-spacing: 5px;

      color: #fff;
    }

    .subtitle {

      margin-top: 8px;

      color: #8e8e93;

      font-size: 14px;
    }

    .card {

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.11),
          rgba(255,255,255,.045)
        );

      border:
        1px solid
        rgba(255,255,255,.10);

      border-radius: 28px;

      padding: 22px;

      box-shadow:
        0 25px 70px
        rgba(0,0,0,.65),

        inset 0 1px 0
        rgba(255,255,255,.06);

      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
    }

    label {

      display: block;

      color: #8e8e93;

      font-size: 13px;

      margin-bottom: 8px;
    }

    input {

      width: 100%;

      height: 54px;

      padding: 0 15px;

      margin-bottom: 18px;

      border:
        1px solid
        rgba(255,255,255,.10);

      border-radius: 16px;

      outline: none;

      background:
        rgba(255,255,255,.07);

      color: #fff;

      font-size: 16px;

      direction: rtl;
    }

    input:focus {

      border-color:
        rgba(255,255,255,.35);

      background:
        rgba(255,255,255,.09);
    }

    input::placeholder {

      color: #666;
    }

    .section-title {

      font-size: 17px;

      font-weight: 700;

      margin:
        5px 0 14px;
    }

    .plans {

      display: flex;

      flex-direction: column;

      gap: 10px;
    }

    .plan {

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 15px;

      min-height: 62px;

      border-radius: 18px;

      background:
        rgba(255,255,255,.055);

      border:
        1px solid
        rgba(255,255,255,.08);

      cursor: pointer;

      transition:
        transform .15s ease,
        background .15s ease,
        border .15s ease;
    }

    .plan:active {

      transform: scale(.98);
    }

    .plan.selected {

      background:
        rgba(255,255,255,.13);

      border-color:
        rgba(255,255,255,.40);
    }

    .plan-left {

      display: flex;

      align-items: center;

      gap: 12px;
    }

    .radio {

      width: 20px;
      height: 20px;

      flex-shrink: 0;

      border-radius: 50%;

      border:
        2px solid
        #666;

      display: flex;

      align-items: center;
      justify-content: center;
    }

    .plan.selected .radio {

      border-color: #fff;
    }

    .plan.selected .radio::after {

      content: "";

      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: #fff;
    }

    .plan-name {

      font-size: 15px;

      font-weight: 600;
    }

    .plan-balance {

      color: #aaa;

      font-size: 13px;

      direction: ltr;

      text-align: left;
    }

    .create {

      width: 100%;

      height: 56px;

      margin-top: 18px;

      border: none;

      border-radius: 17px;

      background: #fff;

      color: #000;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform .15s ease,
        opacity .15s ease;
    }

    .create:active {

      transform: scale(.97);

      opacity: .8;
    }

    .create:disabled {

      opacity: .45;

      cursor: not-allowed;
    }

    .back {

      width: 100%;

      height: 50px;

      margin-top: 12px;

      border:
        1px solid
        rgba(255,255,255,.10);

      border-radius: 16px;

      background:
        rgba(255,255,255,.06);

      color: #fff;

      font-size: 15px;

      cursor: pointer;
    }

    .message {

      display: none;

      margin-top: 15px;

      padding: 14px;

      border-radius: 15px;

      text-align: center;

      font-size: 14px;
    }

    .message.success {

      display: block;

      background:
        rgba(50,200,100,.12);

      color: #70e090;

      border:
        1px solid
        rgba(50,200,100,.20);
    }

    .message.error {

      display: block;

      background:
        rgba(255,50,50,.10);

      color: #ff7070;

      border:
        1px solid
        rgba(255,50,50,.20);
    }

    .result {

      display: none;

      margin-top: 18px;

      padding: 18px;

      border-radius: 18px;

      background:
        rgba(255,255,255,.07);

      text-align: center;
    }

    .account-number {

      font-size: 28px;

      font-weight: 800;

      letter-spacing: 4px;

      direction: ltr;

      margin: 10px 0;
    }

    .result small {

      color: #8e8e93;

      line-height: 1.7;
    }

  </style>

</head>


<body>


<div class="page">


  <div class="top">

    <div class="logo">
      JACK
    </div>

    <div class="subtitle">
      فتح حساب جديد
    </div>

  </div>


  <div class="card">


    <!-- الاسم -->

    <label>
      الاسم
    </label>

    <input
      id="name"
      type="text"
      placeholder="اكتب اسمك"
      autocomplete="name"
    >


    <!-- كلمة المرور -->

    <label>
      كلمة المرور
    </label>

    <input
      id="password"
      type="password"
      inputmode="numeric"
      maxlength="20"
      placeholder="4 أرقام أو أكثر"
      autocomplete="new-password"
    >


    <!-- الاشتراكات -->

    <div class="section-title">
      اختر الاشتراك
    </div>


    <div class="plans">


      <div
        class="plan"
        data-days="1"
        data-balance="100000"
      >

        <div class="plan-left">

          <div class="radio"></div>

          <div class="plan-name">
            يوم واحد
          </div>

        </div>

        <div class="plan-balance">
          100,000 SDG
        </div>

      </div>


      <div
        class="plan"
        data-days="3"
        data-balance="300000"
      >

        <div class="plan-left">

          <div class="radio"></div>

          <div class="plan-name">
            3 أيام
          </div>

        </div>

        <div class="plan-balance">
          300,000 SDG
        </div>

      </div>


      <div
        class="plan"
        data-days="7"
        data-balance="700000"
      >

        <div class="plan-left">

          <div class="radio"></div>

          <div class="plan-name">
            7 أيام
          </div>

        </div>

        <div class="plan-balance">
          700,000 SDG
        </div>

      </div>


      <div
        class="plan"
        data-days="30"
        data-balance="2000000"
      >

        <div class="plan-left">

          <div class="radio"></div>

          <div class="plan-name">
            30 يوم
          </div>

        </div>

        <div class="plan-balance">
          2,000,000 SDG
        </div>

      </div>


      <div
        class="plan"
        data-days="90"
        data-balance="100000000"
      >

        <div class="plan-left">

          <div class="radio"></div>

          <div class="plan-name">
            90 يوم
          </div>

        </div>

        <div class="plan-balance">
          100,000,000 SDG
        </div>

      </div>


      <div
        class="plan"
        data-days="180"
        data-balance="500000000"
      >

        <div class="plan-left">

          <div class="radio"></div>

          <div class="plan-name">
            180 يوم
          </div>

        </div>

        <div class="plan-balance">
          500,000,000 SDG
        </div>

      </div>


      <div
        class="plan"
        data-days="365"
        data-balance="unlimited"
      >

        <div class="plan-left">

          <div class="radio"></div>

          <div class="plan-name">
            سنة كاملة
          </div>

        </div>

        <div class="plan-balance">
          ∞ غير محدود
        </div>

      </div>


    </div>


    <!-- إنشاء الحساب -->

    <button
      id="createBtn"
      class="create"
    >
      فتح الحساب
    </button>


    <!-- رجوع -->

    <button
      id="backBtn"
      class="back"
    >
      رجوع
    </button>


    <!-- الرسالة -->

    <div
      id="message"
      class="message"
    ></div>


    <!-- نتيجة الحساب -->

    <div
      id="result"
      class="result"
    >

      <small>
        تم إنشاء حسابك بنجاح
      </small>

      <div
        id="newAccount"
        class="account-number"
      ></div>

      <small>
        استخدم رقم الحساب وكلمة المرور
        لتسجيل الدخول
      </small>

    </div>


  </div>


</div>


<script type="module">


import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  createUserWithEmailAndPassword
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  set
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


// ========================================
// Firebase Config
// ========================================

const firebaseConfig = {

  apiKey:
    "AIzaSyAuWY3OwK9EJnn8vBhz2-yittn7dDntZBw",

  authDomain:
    "bok-jack.firebaseapp.com",

  databaseURL:
    "https://bok-jack-default-rtdb.firebaseio.com",

  projectId:
    "bok-jack",

  storageBucket:
    "bok-jack.firebasestorage.app",

  messagingSenderId:
    "96539205463",

  appId:
    "1:96539205463:web:a2cb846d657aa873182812",

  measurementId:
    "G-069BL15X9J"

};


// ========================================
// Firebase
// ========================================

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getDatabase(app);


// ========================================
// المتغيرات
// ========================================

let selectedPlan = null;


// ========================================
// العناصر
// ========================================

const plans =
  document.querySelectorAll(".plan");

const nameInput =
  document.getElementById("name");

const passwordInput =
  document.getElementById("password");

const createBtn =
  document.getElementById("createBtn");

const backBtn =
  document.getElementById("backBtn");

const message =
  document.getElementById("message");

const result =
  document.getElementById("result");

const newAccount =
  document.getElementById("newAccount");


// ========================================
// اختيار الاشتراك
// ========================================

plans.forEach(plan => {

  plan.addEventListener(
    "click",
    () => {

      plans.forEach(p => {

        p.classList.remove(
          "selected"
        );

      });


      plan.classList.add(
        "selected"
      );


      selectedPlan = {

        days:
          Number(
            plan.dataset.days
          ),

        balance:
          plan.dataset.balance

      };

    }
  );

});


// ========================================
// إنشاء رقم حساب 7 أرقام
// ========================================

function generateAccountNumber() {

  return String(

    Math.floor(
      1000000 +
      Math.random() * 9000000
    )

  );

}


// ========================================
// إظهار رسالة
// ========================================

function showMessage(
  text,
  type
) {

  message.textContent =
    text;

  message.className =
    "message " + type;

}


// ========================================
// إنشاء الحساب
// ========================================

createBtn.addEventListener(
  "click",
  async () => {


    message.className =
      "message";

    message.textContent =
      "";

    result.style.display =
      "none";


    const name =
      nameInput.value.trim();

    const password =
      passwordInput.value.trim();


    // ====================================
    // التحقق من الاسم
    // ====================================

    if (!name) {

      showMessage(
        "اكتب الاسم أولاً",
        "error"
      );

      return;

    }


    // ====================================
    // التحقق من كلمة المرور
    // ====================================

    if (
      !/^[0-9]{4,}$/.test(password)
    ) {

      showMessage(
        "كلمة المرور يجب أن تكون 4 أرقام أو أكثر",
        "error"
      );

      return;

    }


    // ====================================
    // التحقق من الاشتراك
    // ====================================

    if (!selectedPlan) {

      showMessage(
        "اختر الاشتراك أولاً",
        "error"
      );

      return;

    }


    createBtn.disabled =
      true;

    createBtn.textContent =
      "جاري إنشاء الحساب...";


    try {


      // ==================================
      // إنشاء رقم حساب
      // ==================================

      const accountNumber =
        generateAccountNumber();


      // ==================================
      // البريد الداخلي
      // ==================================

      const internalEmail =
        accountNumber +
        "@bokjack.local";


      // ==================================
      // إنشاء Firebase Auth
      // ==================================

      const credential =
        await createUserWithEmailAndPassword(
          auth,
          internalEmail,
          password
        );


      const uid =
        credential.user.uid;


      // ==================================
      // الوقت
      // ==================================

      const now =
        Date.now();


      const subscriptionEnd =
        now +
        (
          selectedPlan.days *
          24 *
          60 *
          60 *
          1000
        );


      // ==================================
      // هل الرصيد غير محدود؟
      // ==================================

      const isUnlimited =
        selectedPlan.balance ===
        "unlimited";


      const initialBalance =
        isUnlimited
          ? 0
          : Number(
              selectedPlan.balance
            );


      // ==================================
      // حفظ بيانات المستخدم
      // ==================================

      await set(

        ref(
          db,
          "users/" + uid
        ),

        {

          accountNumber:
            accountNumber,

          name:
            name,

          balance:
            initialBalance,

          balanceUnlimited:
            isUnlimited,

          subscriptionStart:
            now,

          subscriptionEnd:
            subscriptionEnd

        }

      );


      // ==================================
      // حفظ رقم الحساب
      // ==================================

      await set(

        ref(
          db,
          "accountNumbers/" +
          accountNumber
        ),

        {

          uid:
            uid

        }

      );


      // ==================================
      // عرض النجاح
      // ==================================

      newAccount.textContent =
        accountNumber;


      result.style.display =
        "block";


      showMessage(
        "تم إنشاء الحساب بنجاح",
        "success"
      );


      createBtn.textContent =
        "تم إنشاء الحساب";


      // ==================================
      // الانتقال لتسجيل الدخول
      // ==================================

      setTimeout(
        () => {

          window.location.href =
            "login.html";

        },
        3000
      );


    } catch (error) {


      console.error(
        "CREATE ACCOUNT ERROR:",
        error
      );


      let errorText =
        "تعذر إنشاء الحساب";


      if (
        error.code ===
        "auth/email-already-in-use"
      ) {

        errorText =
          "حدث تعارض في رقم الحساب، حاول مرة أخرى";

      }

      else if (
        error.code ===
        "auth/weak-password"
      ) {

        errorText =
          "كلمة المرور ضعيفة";

      }

      else if (
        error.code ===
        "auth/operation-not-allowed"
      ) {

        errorText =
          "تسجيل الحسابات غير مفعل في Firebase";

      }

      else if (
        error.code ===
        "auth/network-request-failed"
      ) {

        errorText =
          "تحقق من اتصال الإنترنت";

      }

      else if (
        error.code ===
        "PERMISSION_DENIED"
      ) {

        errorText =
          "Firebase رفض حفظ بيانات الحساب";

      }


      showMessage(
        errorText,
        "error"
      );


      createBtn.disabled =
        false;

      createBtn.textContent =
        "فتح الحساب";

    }

  }
);


// ========================================
// زر الرجوع
// ========================================

backBtn.addEventListener(
  "click",
  () => {

    window.location.href =
      "index.html";

  }
);


</script>


</body>

</html>
