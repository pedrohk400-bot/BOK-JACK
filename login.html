<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - BOK JACK</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:#0d1117;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:92%;
    max-width:400px;
    background:#151b23;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.4);
}

.logo{
    text-align:center;
    font-size:34px;
    font-weight:bold;
}

.sub{
    text-align:center;
    color:#aaa;
    margin:8px 0 25px;
}

input,button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border-radius:12px;
    font-size:16px;
}

input{
    background:#0d1117;
    border:1px solid #30363d;
    color:white;
}

button{
    background:#b00020;
    color:white;
    border:0;
    font-weight:bold;
}

button:disabled{
    opacity:.6;
}

.message{
    text-align:center;
    margin-top:15px;
    line-height:1.8;
}

.error{
    color:#ff5c5c;
}

a{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#aaa;
    text-decoration:none;
}
</style>

</head>

<body>

<div class="box">

    <div class="logo">JACK</div>

    <div class="sub">
        تسجيل الدخول
    </div>

    <input
        id="accountNumber"
        type="text"
        inputmode="numeric"
        maxlength="7"
        placeholder="رقم الحساب">

    <input
        id="password"
        type="password"
        placeholder="كلمة المرور">

    <button id="loginBtn">
        تسجيل الدخول
    </button>

    <div id="message" class="message"></div>

    <a href="account.html">
        فتح حساب جديد
    </a>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    get
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig = {
    apiKey: "AIzaSyAuWY3OwE9Kjnn8vBhz2-yittn7dDntZBw",
    authDomain: "bok-jack.firebaseapp.com",
    databaseURL: "https://bok-jack-default-rtdb.firebaseio.com",
    projectId: "bok-jack",
    storageBucket: "bok-jack.firebasestorage.app",
    messagingSenderId: "96539205463",
    appId: "1:96539205463:web:a2cb846d657aa873182812",
    measurementId: "G-069BL15X9J"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


document.getElementById("loginBtn").addEventListener(
    "click",
    async () => {

        const accountNumber =
            document.getElementById("accountNumber")
            .value.trim();

        const password =
            document.getElementById("password")
            .value;

        const message =
            document.getElementById("message");

        const button =
            document.getElementById("loginBtn");


        if(!/^[0-9]{7}$/.test(accountNumber)){

            message.innerHTML =
                '<span class="error">رقم الحساب يجب أن يكون 7 أرقام</span>';

            return;
        }


        if(!password){

            message.innerHTML =
                '<span class="error">اكتب كلمة المرور</span>';

            return;
        }


        button.disabled = true;
        button.innerText = "جاري الدخول...";


        try {

            /*
             * نفس الإيميل الداخلي الذي تم إنشاؤه
             * عند فتح الحساب.
             */

            const internalEmail =
                accountNumber + "@bokjack.local";


            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    internalEmail,
                    password
                );


            const uid =
                credential.user.uid;


            /*
             * قراءة بيانات الحساب
             */

            const snapshot =
                await get(
                    ref(db, "users/" + uid)
                );


            if(!snapshot.exists()){

                throw new Error(
                    "بيانات الحساب غير موجودة"
                );

            }


            const userData =
                snapshot.val();


            if(
                userData.accountNumber !==
                accountNumber
            ){

                throw new Error(
                    "رقم الحساب غير صحيح"
                );

            }


            /*
             * حفظ معلومات بسيطة للجلسة
             */

            sessionStorage.setItem(
                "accountNumber",
                accountNumber
            );


            sessionStorage.setItem(
                "uid",
                uid
            );


            /*
             * بعد تسجيل الدخول
             * ننتقل إلى الصفحة الرئيسية.
             *
             * إذا عندك صفحة مختلفة غيّر home.html
             */

            window.location.href =
                "home.html";


        } catch(error){

            console.error(error);

            message.innerHTML =
                '<span class="error">' +
                '❌ رقم الحساب أو كلمة المرور غير صحيحة' +
                '</span>';

            button.disabled = false;
            button.innerText = "تسجيل الدخول";

        }

    }
);

</script>

</body>
</html>
